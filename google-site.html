<style>
#bmc-bell-schedule {
  --bmc-v3-black:#242122; --bmc-v3-gray-900:#333132; --bmc-v3-gray-700:#5f5b5c;
  --bmc-v3-gray-300:#d5d2d2; --bmc-v3-gray-100:#f5f3f1; --bmc-v3-white:#fff;
  --bmc-v3-gold:#ddb75f; --bmc-v3-gold-dark:#a9822f;
  position:relative; isolation:isolate; width:100%; min-width:0;
  color:var(--bmc-v3-black); background:#fff;
  font-family:"futura-pt","Futura PT","Avenir Next",Avenir,Montserrat,Arial,sans-serif;
  line-height:1.55; text-rendering:optimizeLegibility;
}
#bmc-bell-schedule, #bmc-bell-schedule *,
#bmc-bell-schedule *::before, #bmc-bell-schedule *::after { box-sizing:border-box; }
#bmc-bell-schedule .schedule-app { width:100%; background:#fff; }
#bmc-bell-schedule h1, #bmc-bell-schedule h2 { font-family:inherit; }
#bmc-bell-schedule .bmc-section-dark { background:var(--bmc-v3-black); color:#fff; }
#bmc-bell-schedule .bmc-eyebrow { font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
#bmc-bell-schedule .bmc-btn { display:inline-block; margin:0; border:2px solid; border-radius:0; background:transparent; color:var(--bmc-v3-black); font-family:inherit; font-weight:800; line-height:1.3; text-align:center; cursor:pointer; }
#bmc-bell-schedule .bmc-btn:hover { background:var(--bmc-v3-gold); }
#bmc-bell-schedule .bmc-btn:focus-visible { outline:3px solid var(--bmc-v3-gold-dark); outline-offset:2px; }
/* Keyboard skip link. */

#bmc-bell-schedule .skip-link {
  position: absolute;
  top: .75rem;
  left: .75rem;
  z-index: 100;
  padding: .7rem 1rem;
  background: var(--bmc-v3-gold);
  color: var(--bmc-v3-black);
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
}

#bmc-bell-schedule .skip-link:focus {
  opacity: 1;
  pointer-events: auto;
}

/* Centered live clock. */
#bmc-bell-schedule .utility-header {
  display:flex;
  min-height:72px;
  align-items:center;
  justify-content:center;
  padding:.8rem 1rem;
  border-bottom:5px solid var(--bmc-v3-gold);
}
#bmc-bell-schedule .utility-clock {
  width:100%;
  color:var(--bmc-v3-white);
  text-align:center;
  font-variant-numeric:tabular-nums;
}
#bmc-bell-schedule .utility-time {
  display:block;
  color:var(--bmc-v3-white);
  font-size:clamp(1.5rem,3vw,2.5rem);
  font-weight:650;
  line-height:1.2;
  white-space:nowrap;
}

/* Horizontally scrolling schedule selector. */

#bmc-bell-schedule .schedule-nav {
  min-width: 0;
  padding: .55rem clamp(.65rem, 1.5vw, 1.25rem);
  border-bottom: 1px solid var(--bmc-v3-gray-300);
  background: var(--bmc-v3-gray-100);
}

#bmc-bell-schedule .schedule-nav-scroll {
  display: flex;
  gap: .45rem;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-color: var(--bmc-v3-gold-dark) var(--bmc-v3-gray-300);
  scrollbar-width: thin;
}

/* Buttons grow evenly and retain readable labels. */
#bmc-bell-schedule .schedule-nav button.bmc-btn {
  flex: 1 0 108px;
  min-width: max-content;
  min-height: 40px;
  padding-inline: clamp(.7rem, 1.3vw, 1.05rem);
  border-color: var(--bmc-v3-gray-900);
  font-size: clamp(.78rem, .9vw, .95rem);
  white-space: nowrap;
}

/* Selected schedule. */
#bmc-bell-schedule .schedule-nav button.bmc-btn.active {
  border-color: var(--bmc-v3-gold-dark) !important;
  background: var(--bmc-v3-gold) !important;
  color: var(--bmc-v3-black) !important;
}

/* Full-height schedule region. */

#bmc-bell-schedule .schedule-display {
  min-width: 0;
  min-height: 0;
  overflow: auto;
  background: var(--bmc-v3-white);
}

#bmc-bell-schedule #bmc-schedule-table {
  width: 100%;
  min-width: 620px;
  height: 100%;
  margin: 0;
  border-collapse: collapse;
  table-layout: fixed;
  font-variant-numeric: tabular-nums;
}

#bmc-bell-schedule #bmc-schedule-table th,
#bmc-bell-schedule #bmc-schedule-table td {
  /* Compact spacing preserves room for projector-sized type. */
  padding: clamp(.2rem, .6vh, .5rem) clamp(.4rem, .9vw, .8rem);
  border: 1px solid var(--bmc-v3-gray-300);
  text-align: left;
  vertical-align: middle;
}

#bmc-bell-schedule #bmc-schedule-table th {
  height: clamp(42px, 6vh, 62px);
  background: var(--bmc-v3-black);
  color: var(--bmc-v3-white);
  font-size: clamp(.9rem, 1.35vw, 1.3rem);
  font-weight: 800;
  letter-spacing: .1em;
  line-height: 1.1;
  text-transform: uppercase;
}

#bmc-bell-schedule #bmc-schedule-table td {
  background: var(--bmc-v3-white);
  color: var(--bmc-v3-black);
  font-size: clamp(1.2rem, 2.7vw, 2.4rem);
  line-height: 1.1;

  /* Animate both highlight and reset states. */
  transition:
    background-color .45s ease,
    border-color .45s ease,
    color .3s ease;
}

#bmc-bell-schedule #bmc-schedule-table tbody tr:nth-child(odd) td {
  background: var(--bmc-v3-gray-100);
}

#bmc-bell-schedule #bmc-schedule-table td:first-child {
  font-weight: 800;
}

/* Active period or passing cell. */
#bmc-bell-schedule #bmc-schedule-table td.highlighted {
  border-color: var(--bmc-v3-gold-dark);
  background: var(--bmc-v3-gold) !important;
  color: var(--bmc-v3-black) !important;
  font-weight: 800;

  /* Brief bell-ring text motion. */
  animation: bmc-schedule-bell-ring-jiggle .6s ease-in-out 1;
}

/* Replay the active end-time cue at reminder thresholds. */
#bmc-bell-schedule #bmc-schedule-table td.highlighted.bmc-schedule-end-time-reminder {
  position: relative;
  animation: bmc-schedule-end-time-reminder 1.4s ease-in-out 1;
}

#bmc-bell-schedule #bmc-schedule-table td.highlighted.bmc-schedule-end-time-reminder::after {
  position: absolute;
  top: 50%;
  right: .4em;
  color: var(--bmc-v3-black);
  content: attr(data-bmc-schedule-end-time-reminder);
  font-size: 1em;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  line-height: 1;
  pointer-events: none;
  text-indent: 0;
  white-space: nowrap;
  animation: bmc-schedule-end-time-countdown 1.4s ease-in-out 1;
}

/* Inline countdown beside the passing duration. */
#bmc-bell-schedule #bmc-schedule-table .passing-countdown {
  display: inline-flex;
  align-items: baseline;
  gap: .25em;
  min-width: 0;
  margin-left: .4em;
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1;
  vertical-align: baseline;
  white-space: nowrap;
}

#bmc-bell-schedule #bmc-schedule-table .passing-countdown-value,
#bmc-bell-schedule #bmc-schedule-table .passing-countdown-label {
  display: inline;
}

#bmc-bell-schedule #bmc-schedule-table .passing-countdown-value {
  font-size: 1em;
}

#bmc-bell-schedule #bmc-schedule-table .passing-countdown-label {
  margin-left: 0;
  font-size: .5em;
  letter-spacing: .08em;
  text-transform: uppercase;
  vertical-align: baseline;
}

/* Urgent countdown below two minutes. */
#bmc-bell-schedule #bmc-schedule-table .passing-countdown-urgent {
  color: var(--bmc-v3-danger);
  font-weight: 500;
}

@keyframes bmc-schedule-bell-ring-jiggle {
  0%,
  100% {
    text-indent: 0;
  }

  20% {
    text-indent: -.16em;
  }

  40% {
    text-indent: .13em;
  }

  60% {
    text-indent: -.09em;
  }

  80% {
    text-indent: .05em;
  }
}

@keyframes bmc-schedule-end-time-reminder {
  0%,
  100% {
    box-shadow: inset 0 0 0 0 transparent;
    text-indent: 0;
  }

  20% {
    box-shadow: inset 0 0 0 .12em var(--bmc-v3-gold-dark);
    text-indent: -.16em;
  }

  40% {
    box-shadow: inset 0 0 0 .2em var(--bmc-v3-gold-dark);
    text-indent: .13em;
  }

  60% {
    box-shadow: inset 0 0 0 .12em var(--bmc-v3-gold-dark);
    text-indent: -.09em;
  }

  80% {
    box-shadow: inset 0 0 0 .05em var(--bmc-v3-gold-dark);
    text-indent: .05em;
  }
}

@keyframes bmc-schedule-end-time-countdown {
  0%,
  100% {
    opacity: 0;
    transform: translateY(-42%);
  }

  20%,
  80% {
    opacity: 1;
    transform: translateY(-50%);
  }
}

/* End-of-day confetti overlay. */
#bmc-bell-schedule .end-of-day-confetti {
  position: absolute;
  z-index: 200;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

#bmc-bell-schedule .confetti-piece {
  position: absolute;
  top: -1rem;
  left: var(--confetti-left);
  width: clamp(.35rem, .65vw, .6rem);
  height: clamp(.65rem, 1vw, .95rem);
  border-radius: .1rem;
  opacity: 0;
  animation: bmc-schedule-confetti-fall var(--confetti-duration) ease-in forwards;
  animation-delay: var(--confetti-delay);
}

#bmc-bell-schedule .confetti-piece:nth-child(5n + 1) {
  background: var(--bmc-v3-black);
}

#bmc-bell-schedule .confetti-piece:nth-child(5n + 2) {
  background: var(--bmc-v3-gold);
}

#bmc-bell-schedule .confetti-piece:nth-child(5n + 3) {
  background: var(--bmc-v3-gray-500);
}

#bmc-bell-schedule .confetti-piece:nth-child(5n + 4) {
  border: 1px solid var(--bmc-v3-gray-500);
  background: var(--bmc-v3-white);
}

#bmc-bell-schedule .confetti-piece:nth-child(5n + 5) {
  background: #ffdf00;
}

@keyframes bmc-schedule-confetti-fall {
  0% {
    opacity: 0;
    transform: translate3d(0, -5vh, 0) rotate(0);
  }

  10%,
  85% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform:
      translate3d(var(--confetti-drift), 110vh, 0)
      rotate(var(--confetti-spin));
  }
}

/* Responsive refinements. */

@media (max-width: 760px) {

  #bmc-bell-schedule #bmc-schedule-table td {
    font-size: 1.15rem;
  }
}

/* Reduced-motion preference. */

@media (prefers-reduced-motion: reduce) {
  #bmc-bell-schedule *,
  #bmc-bell-schedule *::before,
  #bmc-bell-schedule *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }

  /* Keep the highlight without motion. */
  #bmc-bell-schedule #bmc-schedule-table td.highlighted,
  #bmc-bell-schedule #bmc-schedule-table td.highlighted.bmc-schedule-end-time-reminder {
    animation: none !important;
  }

  #bmc-bell-schedule #bmc-schedule-table td.highlighted.bmc-schedule-end-time-reminder::after {
    animation: none !important;
  }

  #bmc-bell-schedule .end-of-day-confetti {
    display: none;
  }
}

<script>
(function () {
"use strict";
const root = document.getElementById("bmc-bell-schedule");
if (!root || root.dataset.initialized) return;
root.dataset.initialized = "true";


// ===========================================================
// Data for Bell Schedules 
// ===========================================================

// Optional HTTPS JSON endpoint. It must allow cross-origin reads from the embed.
// Leave blank to use the application/json block above. Do not use a Google Sites page URL.
const DATA_URL = "";
let config = JSON.parse(document.getElementById('bmc-schedule-data').textContent);
let data = {};
function escapeText(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validateConfig(value) {
 if(value.version!==1 || !Array.isArray(value.schedules) || !value.schedules.length) throw Error('Invalid schedule document');
 const ids=new Set();
 const time=s=>typeof s==='string' && /^(0?[1-9]|1[0-2]):[0-5][0-9] (am|pm)$/.test(s);
 for(const schedule of value.schedules) {
  if(!/^btn-[A-Za-z0-9_-]+$/.test(schedule.id)||ids.has(schedule.id)||typeof schedule.label!=='string'||!schedule.label.trim()||!Array.isArray(schedule.periods)||!schedule.periods.length) throw Error('Invalid or duplicate schedule');
  ids.add(schedule.id);
  let last=-1;
  for(const row of schedule.periods) {
   if(typeof row.label!=='string'||!time(row.start)||!time(row.end)||typeof row.duration!=='string'||typeof row.passing!=='string') throw Error('Invalid period');
   const start=getDate(row.start).getTime(),end=getDate(row.end).getTime();
   if(end<=start || start<last) throw Error('Overlapping or reversed periods');
   last=end;
  }
 }
 if(!ids.has(value.defaultSchedule)||!value.weekdays||!Array.isArray(value.overrides)) throw Error('Missing default rules');
 for(const id of Object.values(value.weekdays)) if(!ids.has(id)) throw Error('Unknown weekday schedule');
 for(const rule of value.overrides) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(rule.date)||!ids.has(rule.schedule)||(rule.from && !/^([01]\d|2[0-3]):[0-5]\d$/.test(rule.from))) throw Error('Invalid date override');
 }
}
function scheduleForDate(value,now) {
 const date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
 const minute=now.getHours()*60+now.getMinutes();
 const matches=value.overrides.filter(rule=>rule.date===date && (!rule.from || minute>=Number(rule.from.slice(0,2))*60+Number(rule.from.slice(3))));
 matches.sort((a,b)=>(a.from||'00:00').localeCompare(b.from||'00:00'));
 return matches.length?matches[matches.length-1].schedule:(value.weekdays[String(now.getDay())]||value.defaultSchedule);
}
function applyConfig(value) {
 validateConfig(value);
 const followingToday=!currentSchedule || currentSchedule===todaySchedule;
 config=value;
 data=Object.fromEntries(config.schedules.map(s=>[s.id,[['Period','Start','End','Duration','Passing'],...s.periods.map(p=>[p.label,p.start,p.end,p.duration,p.passing])]]));
 todaySchedule=scheduleForDate(config,new Date());
 const nav=root.querySelector('.schedule-nav-scroll'); nav.replaceChildren(); picker.replaceChildren();
 for(const schedule of config.schedules.filter(s=>s.visible || s.id===todaySchedule || s.id===currentSchedule)) {
  const button=document.createElement('button');button.type='button';button.id=schedule.id;button.className='bmc-btn bmc-btn-sm bmc-btn-outline';button.textContent=schedule.label;button.addEventListener('click',()=>navClick(schedule.id));nav.appendChild(button);
  const option=document.createElement('option');option.value=schedule.id;option.textContent=schedule.label;picker.appendChild(option);
 }
 navClick(followingToday || !data[currentSchedule]?todaySchedule:currentSchedule);
}
let screenTimer = null;
let currentSchedule = '';
let todaySchedule = '';
const picker = root.querySelector('#mobile-schedule-select');

picker.addEventListener('change', () => navClick(picker.value));
root.querySelector('.today-button').addEventListener('click', () => navClick(todaySchedule));


// Respond to topnav menu button clicked 
function navClick(btnClicked) {
    currentSchedule = btnClicked;
    
    if (!Array.from(picker.options).some(option => option.value === btnClicked)) {
      const option=document.createElement('option'); option.value=btnClicked; option.textContent=config.schedules.find(s=>s.id===btnClicked).label; picker.appendChild(option);
    }
    picker.value=btnClicked;

    // Change active button to button clicked
    root.querySelectorAll(".schedule-nav button.active").forEach(function (button) {
        button.classList.remove("active");
    });
    const selectedButton = root.querySelector("#" + btnClicked);
    if (selectedButton) selectedButton.classList.add("active");
    root.querySelectorAll('.schedule-nav button').forEach(button => button.setAttribute('aria-pressed', String(button.id === btnClicked)));
    
    buildTable(data[btnClicked]);
    updateScreen();
    updateMobileStatus();

    // Keep one screen timer regardless of menu changes.
    if (screenTimer === null)
        screenTimer = setInterval(updateScreen, 1000);
}

// Generic build table from data array
function buildTable(tableArr) {
    // Remove existing schedule
    const schedule = root.querySelector("#" + "bmc-schedule-output");
    schedule.innerHTML = "";
    const [headings, ...rows] = tableArr;
    let tableString = '<table id="bmc-schedule-table" role="table"><caption>Full schedule</caption><thead><tr>';
    for (let header of headings) {
        tableString += '<th scope="col">' + header + "</th>";
    }
    tableString += "</tr></thead><tbody>"

    for (let aRow of rows) {
        tableString += "<tr>";
        for (let cell of aRow) {
            tableString += "<td>" + escapeText(cell) + "</td>";
        }
        tableString += "</tr>";
    }
    tableString += "</tbody></table>";
    schedule.innerHTML = tableString;
}

// Helper function for updateScreen()
function getDate(timeStr) {
    timeStr = timeStr.trim();
    let now = new Date();
    let hr = parseInt(timeStr.split(":")[0]);
    let mi = parseInt((timeStr.split(":")[1]).split(" ")[0]);
    let meridiem = timeStr.split(" ")[1];
    if (meridiem == "pm" && hr < 12) {
        hr = hr + 12;
    } 
    if (meridiem == "am" && hr === 12) hr = 0;
    now.setHours(hr, mi, 0, 0);
    return now;
}

// Updates Screen every second for clock and highlighting the period
function updateScreen() {
    // Get current time - need seconds
    let now = new Date();

    // Update Clock
    const timeDiv = root.querySelector("#" + "bmc-schedule-clock");
    const currentTime = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
    });
    timeDiv.innerHTML = "<span class='utility-time'>" + currentTime + "</span><span class='mobile-date'>" + now.toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric'}) + "</span>";

        
    // Get table to highlight current period
    let table = root.querySelector("#" + "bmc-schedule-table");

    // Use a static list so removing classes cannot skip cells.
    root.querySelectorAll("#bmc-schedule-table .highlighted").forEach(function (cell) {
        cell.classList.remove("highlighted");
    });

    // Highlight Current Period
    for (var r = 1, n = table.rows.length; r < n; r++) {
        let startStr = table.rows[r].cells[1].innerHTML;
        let startTime = getDate(startStr)
        let endStr = table.rows[r].cells[2].innerHTML;
        let endTime = getDate(endStr);
        // console.log(startTime, now, endTime);
        if (startTime <= now && now < endTime) {
            // console.log("Row:", r);
            table.rows[r].cells[0].classList.add('highlighted');
            table.rows[r].cells[1].classList.add('highlighted');
            table.rows[r].cells[2].classList.add('highlighted');
            table.rows[r].cells[3].classList.add('highlighted');
            table.rows[r].cells[4].classList.remove('highlighted');
        }
    }
    // Highlight if in passing between periods
    for (var r = 1, n = table.rows.length; r < n-1; r++) {
        let startStr = table.rows[r].cells[2].innerHTML;
        let startTime = getDate(startStr)
        let endStr = table.rows[r+1].cells[1].innerHTML;
        let endTime = getDate(endStr);
        // console.log(startTime, now, endTime);
        if (startTime <= now && now < endTime) {
            // console.log("Row:", r);
            table.rows[r].cells[0].classList.remove('highlighted');
            table.rows[r].cells[1].classList.remove('highlighted');
            table.rows[r].cells[2].classList.remove('highlighted');
            table.rows[r].cells[3].classList.remove('highlighted');
            table.rows[r].cells[4].classList.add('highlighted');
        }
    }
}

function updateMobileStatus() {
 const rows=Array.from(root.querySelectorAll('#bmc-schedule-table tbody tr'));
 const now=new Date(); const seconds=(end)=>Math.max(0,Math.ceil((end-now)/1000));
 const panel=root.querySelector('.now-panel');
 const put=(selector,value)=>{const el=panel.querySelector(selector); if(el.textContent!==value) el.textContent=value;};
 let active=-1, upcoming=-1;
 rows.forEach((row,index)=>{
   const start=getDate(row.cells[1].textContent), end=getDate(row.cells[2].textContent);
   const live=start<=now && now<end;
   row.classList.toggle('is-current',live);
   row.classList.toggle('is-passing',!!row.cells[4].querySelector('.passing-countdown'));
   if(live) active=index;
   if(upcoming<0 && start>now) upcoming=index;
 });
 const preview=currentSchedule!==todaySchedule;
 const row=rows[active>=0?active:upcoming];
 const passing=active<0 && upcoming>0;
 put('.now-eyebrow',preview?'Schedule preview':active>=0?'Happening now':passing?'Passing time':upcoming>=0?'Before school':'Schedule complete');
 put('.now-title',active>=0?row.cells[0].textContent+' period':passing?'Time to head to class':upcoming>=0?'Your day starts soon':'That’s the full schedule');
 if(active>=0 && !/^\d/.test(row.cells[0].textContent)) put('.now-title',row.cells[0].textContent);
 put('.now-detail',row ? (active>=0?row.cells[1].textContent.trim()+' – '+row.cells[2].textContent.trim():row.cells[0].textContent+' starts at '+row.cells[1].textContent.trim()) : 'Last period ended at '+rows[rows.length-1].cells[2].textContent.trim());
 const target=row?getDate(row.cells[active>=0?2:1].textContent):null;
 const left=target?seconds(target):0;
 panel.querySelector('.now-countdown').hidden=!row;
 put('.now-countdown span',Math.floor(left/60)+':'+String(left%60).padStart(2,'0'));
 put('.now-countdown small',active>=0?'remaining':'until class');
 const progress=panel.querySelector('progress'); progress.hidden=active<0;
 if(active>=0){const start=getDate(row.cells[1].textContent); progress.value=Math.min(100,Math.max(0,(now-start)/(target-start)*100));}
 const next=rows[active>=0?active+1:upcoming];
 put('.now-next',next?'Up next · '+next.cells[0].textContent+' · '+next.cells[1].textContent.trim():'No more periods in this schedule');
 panel.classList.toggle('urgent',passing && left<120);
 const top=root.querySelector('.header-remaining');
 top.querySelector('.header-context').textContent=(preview?'Preview · ':'')+(active>=0?row.cells[0].textContent:passing?'Passing':row?'Before school':'Finished');
 top.querySelector('.header-count').textContent=row?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'—';
 top.querySelector('.header-label').textContent=row?(active>=0?'remaining':'until class'):'for this schedule';
 top.classList.toggle('urgent',passing && left<120);
}

applyConfig(config);
// Re-evaluate date and time rules even when a display stays open overnight.
setInterval(function(){ if(scheduleForDate(config,new Date())!==todaySchedule) applyConfig(config); },1000);
let loadingData=false;
async function refreshData(){
 if(!DATA_URL || loadingData) return;
 loadingData=true;
 const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),12000);
 try {
  const url=new URL(DATA_URL);if(url.protocol!=='https:') throw Error('Use HTTPS');
  const response=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});
  if(!response.ok) throw Error('Schedule service unavailable');
  applyConfig(await response.json());
  root.querySelector('.data-status').hidden=true;
 } catch(error) {
  const status=root.querySelector('.data-status');status.textContent='Schedule updates unavailable. Showing the last loaded schedule.';status.hidden=false;
 } finally {clearTimeout(timeout);loadingData=false;}
}
refreshData();setInterval(refreshData,300000);
/* Add a live countdown to the highlighted passing cell. */
function updatePassingCountdown() {
    const table = root.querySelector("#" + "bmc-schedule-table");
    const existingCountdowns = root.querySelectorAll(".passing-countdown");

    // Clear countdowns when no passing column is available.
    if (!table) {
        existingCountdowns.forEach(function (countdown) {
            countdown.remove();
        });
        return;
    }

    // The fifth cell is highlighted only during passing time.
    const passingCell = table.querySelector("tbody td:nth-child(5).highlighted");
    if (!passingCell) {
        existingCountdowns.forEach(function (countdown) {
            countdown.remove();
        });
        return;
    }

    const currentRow = passingCell.parentElement;
    const nextRow = currentRow.nextElementSibling;
    if (!nextRow) {
        return;
    }

    const nextStart = getDate(nextRow.cells[1].textContent);
    const remainingSeconds = Math.max(
        0,
        Math.ceil((nextStart.getTime() - new Date().getTime()) / 1000)
    );

    // Remove zero at the next period boundary.
    if (remainingSeconds === 0) {
        existingCountdowns.forEach(function (countdown) {
            countdown.remove();
        });
        return;
    }

    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = String(remainingSeconds % 60).padStart(2, "0");
    let countdown = passingCell.querySelector(".passing-countdown");

    // Append the countdown without replacing the passing duration.
    if (!countdown) {
        countdown = document.createElement("span");
        countdown.className = "passing-countdown";

        const countdownValue = document.createElement("span");
        countdownValue.className = "passing-countdown-value";
        countdown.appendChild(countdownValue);

        const countdownLabel = document.createElement("span");
        countdownLabel.className = "passing-countdown-label";
        countdownLabel.textContent = "left";
        countdown.appendChild(countdownLabel);

        passingCell.appendChild(countdown);
    }

    // Update the numeric value and keep the LEFT label stable.
    countdown.querySelector(".passing-countdown-value").textContent =
        minutes + ":" + seconds;
    countdown.title = minutes + " minutes and " + seconds
        + " seconds until " + nextRow.cells[0].textContent.trim();

    // Apply the urgent style below two minutes.
    countdown.classList.toggle(
        "passing-countdown-urgent",
        remainingSeconds < 120
    );

    // Remove countdowns left in previous rows.
    existingCountdowns.forEach(function (existingCountdown) {
        if (existingCountdown !== countdown) {
            existingCountdown.remove();
        }
    });
}

// Refresh after the screen timer updates the highlight.
updatePassingCountdown();
updateMobileStatus();
setInterval(function(){updatePassingCountdown(); updateMobileStatus();}, 1000);

/* Replay the end-time cue when a period reaches 10 or 5 minutes left. */
let lastEndTimeReminderTick = null;

function updateEndTimeReminder() {
    const now = new Date();
    const previousTick = lastEndTimeReminderTick;
    lastEndTimeReminderTick = now.getTime();

    // Ignore the first check and backward debug jumps.
    if (previousTick === null || now.getTime() < previousTick) {
        return;
    }

    const endTimeCell = root.querySelector(
        "#bmc-schedule-table tbody td:nth-child(3).highlighted"
    );
    if (!endTimeCell) {
        return;
    }

    const row = endTimeCell.parentElement;
    const startTime = getDate(row.cells[1].textContent).getTime();
    const endTime = getDate(endTimeCell.textContent).getTime();
    const thresholds = [10 * 60 * 1000, 5 * 60 * 1000];
    const crossedReminders = thresholds.filter(function (threshold) {
        const reminderTime = endTime - threshold;
        return endTime - startTime >= threshold
            && previousTick < reminderTime
            && now.getTime() >= reminderTime;
    });

    if (crossedReminders.length === 0) {
        return;
    }

    root.querySelector(".now-panel").classList.add("reminder");
    window.setTimeout(() => root.querySelector(".now-panel").classList.remove("reminder"), 1400);
    const reminderMinutes =
        crossedReminders[crossedReminders.length - 1] / (60 * 1000);
    endTimeCell.classList.remove("bmc-schedule-end-time-reminder");
    void endTimeCell.offsetWidth;
    endTimeCell.setAttribute(
        "data-bmc-schedule-end-time-reminder",
        "T-" + reminderMinutes
    );
    endTimeCell.classList.add("bmc-schedule-end-time-reminder");

    window.setTimeout(function () {
        endTimeCell.classList.remove("bmc-schedule-end-time-reminder");
        endTimeCell.removeAttribute("data-bmc-schedule-end-time-reminder");
    }, 1400);
}

updateEndTimeReminder();
setInterval(updateEndTimeReminder, 1000);

/* Celebrate when the clock crosses the end of 8th period. */
let lastEndOfDayTick = null;

function launchEndOfDayConfetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
    }

    const existingConfetti = root.querySelector(".end-of-day-confetti");
    if (existingConfetti) {
        existingConfetti.remove();
    }

    const confetti = document.createElement("div");
    confetti.className = "end-of-day-confetti";
    confetti.setAttribute("aria-hidden", "true");

    for (let index = 0; index < 48; index++) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.setProperty("--confetti-left", Math.random() * 100 + "%");
        piece.style.setProperty(
            "--confetti-drift",
            (Math.random() * 12 - 6) + "vw"
        );
        piece.style.setProperty(
            "--confetti-spin",
            (Math.random() * 720 + 360) + "deg"
        );
        piece.style.setProperty(
            "--confetti-duration",
            (Math.random() * 1.2 + 2.8) + "s"
        );
        piece.style.setProperty(
            "--confetti-delay",
            (Math.random() * .45) + "s"
        );
        confetti.appendChild(piece);
    }

    root.appendChild(confetti);
    window.setTimeout(function () {
        confetti.remove();
    }, 4500);
}

function updateEndOfDayCelebration() {
    const now = new Date().getTime();
    const previousTick = lastEndOfDayTick;
    lastEndOfDayTick = now;

    // Ignore the first check and backward debug jumps.
    if (previousTick === null || now < previousTick) {
        return;
    }

    const rows = root.querySelectorAll("#bmc-schedule-table tbody tr");
    let eighthPeriodRow = null;
    rows.forEach(function (row) {
        if (row.cells[0].textContent.trim().toLowerCase() === "8th") {
            eighthPeriodRow = row;
        }
    });

    if (!eighthPeriodRow) {
        return;
    }

    const endTime = getDate(eighthPeriodRow.cells[2].textContent).getTime();
    if (previousTick < endTime && now >= endTime) {
        launchEndOfDayConfetti();
    }
}

updateEndOfDayCelebration();
setInterval(updateEndOfDayCelebration, 1000);



})();
</script>
